name: بناء تطبيق محفظتي (APK)

on:
  push:
    branches: ["**"]
    paths:
      - "android-wallet/**"
      - ".github/workflows/android-wallet.yml"
  pull_request:
    paths:
      - "android-wallet/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wallet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Mahfazti-${{ github.run_number }}.apk"
          ls -lh ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazti-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
