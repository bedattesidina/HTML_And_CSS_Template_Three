<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريف — دفتر الحسابات و الدخل</title>
<meta name="description" content="محفظتك على الهاتف: المصروفات، الراتب، المدخرات، الديون والتقارير. يعمل بدون إنترنت وبياناتك تبقى على جهازك.">

<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريف">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ملف الأيقونات المتجهة المستخدمة في الواجهة -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.8 20v-5.3h4.4V20"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.6" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.6" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.6" cy="18" r="1.3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-debt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5h18v11H3z"/><path d="M3 11h18"/><circle cx="7.5" cy="15" r="1.4"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3.4" height="5"/><rect x="13.4" y="7.5" width="3.4" height="9.5"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M12 2.8v2.3M12 18.9v2.3M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.8 12h2.3M18.9 12h2.3M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5l7 7-7 7"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10.5" width="14" height="10" rx="2.4"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 6l-6 6 6 6"/>
    </symbol>
    <symbol id="i-piggy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13.5a6.5 6.5 0 0 1 6.5-6.5h4A5.5 5.5 0 0 1 20 12.5v1a5.5 5.5 0 0 1-5.5 5.5h-4A6.5 6.5 0 0 1 4 13.5z"/>
      <circle cx="15.5" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M8 19v1.6M16 19v1.6"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16"/><path d="M9.5 7V4.8h5V7"/><path d="M6.4 7l.9 12.4h9.4L17.6 7"/><path d="M10.4 11v5M13.6 11v5"/>
    </symbol>
    <symbol id="i-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/>
    </symbol>
  </defs>
</svg>

<div class="app">

  <header class="topbar">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">
      <svg aria-hidden="true"><use href="#i-theme"/></svg>
    </button>
    <h1 id="screenTitle">الرئيسية<span class="sub" id="screenSub">نظرة عامة على محفظتك</span></h1>
    <button class="icon-btn" id="moreBtn" type="button" aria-label="المزيد والإعدادات">
      <svg aria-hidden="true"><use href="#i-gear"/></svg>
    </button>
  </header>

  <main>
    <section class="screen is-active" id="screen-home"    role="tabpanel" aria-labelledby="tab-home"></section>
    <section class="screen"           id="screen-tx"      role="tabpanel" aria-labelledby="tab-tx"></section>
    <section class="screen"           id="screen-debts"   role="tabpanel" aria-labelledby="tab-debts"></section>
    <section class="screen"           id="screen-reports" role="tabpanel" aria-labelledby="tab-reports"></section>
    <section class="screen"           id="screen-goals"   aria-label="المدخرات"></section>
    <section class="screen"           id="screen-more"    aria-label="المزيد والإعدادات"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="أقسام التطبيق">
    <button type="button" id="tab-home"    role="tab" aria-selected="true"  data-screen="home">
      <svg aria-hidden="true"><use href="#i-home"/></svg>الرئيسية
    </button>
    <button type="button" id="tab-tx"      role="tab" aria-selected="false" data-screen="tx">
      <svg aria-hidden="true"><use href="#i-list"/></svg>المعاملات
    </button>
    <button type="button" tabindex="-1" aria-hidden="true"></button>
    <button type="button" id="tab-debts"   role="tab" aria-selected="false" data-screen="debts">
      <svg aria-hidden="true"><use href="#i-debt"/></svg>الديون
    </button>
    <button type="button" id="tab-reports" role="tab" aria-selected="false" data-screen="reports">
      <svg aria-hidden="true"><use href="#i-chart"/></svg>التقارير
    </button>
  </nav>

  <button class="fab" id="fab" type="button" aria-label="إضافة معاملة جديدة">
    <svg aria-hidden="true"><use href="#i-plus"/></svg>
  </button>
</div>

<!-- اللوح المنسدل العام -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <button type="button" id="sheetClose">إلغاء</button>
    <h2 id="sheetTitle"></h2>
    <button type="button" id="sheetAction" hidden>حفظ</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- شاشة القفل برمز PIN -->
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="ico" aria-hidden="true">🔒</div>
  <h2 id="lockTitle">أدخل رمز القفل</h2>
  <div class="dots" id="lockDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="msg" id="lockMsg" role="status" aria-live="polite"></p>
  <div class="keypad" id="keypad"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><div></div></div>

<script src="js/format.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
